name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: cargo install trunk

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @lhci/cli
      - run: sleep 30
      - run: lhci autorun || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          echo "## Lighthouse Report" >> $GITHUB_STEP_SUMMARY
          for file in .lighthouseci/lhr-*.json; do
            [ -f "$file" ] || continue
            echo "| Metric | Score |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Performance | $(jq '.categories.performance.score * 100 | floor' $file) |" >> $GITHUB_STEP_SUMMARY
            echo "| Accessibility | $(jq '.categories.accessibility.score * 100 | floor' $file) |" >> $GITHUB_STEP_SUMMARY
            echo "| SEO | $(jq '.categories.seo.score * 100 | floor' $file) |" >> $GITHUB_STEP_SUMMARY
            break
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
